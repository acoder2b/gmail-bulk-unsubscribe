[project]
name = "gmail-bulk-unsubscribe"
version = "0.3.0"
description = "Clean up your Gmail inbox, bulk-unsubscribe via RFC 8058 one-click List-Unsubscribe, and generate an AI-powered weekly clutter report (Anthropic or OpenAI). Fork of mxngls/Gmail-Cleaner."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth",
    "tqdm",
    "requests",
    "anthropic",
    "openai",
    "python-dotenv",
    "ruff>=0.9.9",
]
